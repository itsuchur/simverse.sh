# Usage: docker compose -f compose.prod.yaml up -d
services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_POSTHOG_KEY: "${NEXT_PUBLIC_POSTHOG_KEY:-}"
        NEXT_PUBLIC_POSTHOG_HOST: "${NEXT_PUBLIC_POSTHOG_HOST:-https://us.i.posthog.com}"
    container_name: app
    restart: unless-stopped
    environment:
      DATABASE_URL: "${DATABASE_URL}"
      REDIS_URL: "${REDIS_URL}"
      BETTER_AUTH_SECRET: "${BETTER_AUTH_SECRET}"
      BETTER_AUTH_URL: "${BETTER_AUTH_URL}"
      MINIAPP_URL: "${MINIAPP_URL}"
      API_URL: "${API_URL}"
      TELEGRAM_BOT_TOKEN: "${TELEGRAM_BOT_TOKEN}"
      TELEGRAM_BOT_USERNAME: "${TELEGRAM_BOT_USERNAME}"
      TELEGRAM_WEBHOOK_SECRET: "${TELEGRAM_WEBHOOK_SECRET}"
      ESIMACCESS_ACCESS_CODE: "${ESIMACCESS_ACCESS_CODE}"
      ESIMACCESS_WEBHOOK_SECRET: "${ESIMACCESS_WEBHOOK_SECRET}"
      CRYPTOMUS_MERCHANT_ID: "${CRYPTOMUS_MERCHANT_ID}"
      CRYPTOMUS_API_KEY: "${CRYPTOMUS_API_KEY}"
      TRYBIT_API_KEY: "${TRYBIT_API_KEY}"
      TRYBIT_SHOP_ID: "${TRYBIT_SHOP_ID}"
      TRYBIT_SECRET_KEY: "${TRYBIT_SECRET_KEY}"
      CARDLINK_API_TOKEN: "${CARDLINK_API_TOKEN}"
      CARDLINK_SHOP_ID: "${CARDLINK_SHOP_ID}"
      GOOGLE_CLIENT_ID: "${GOOGLE_CLIENT_ID}"
      GOOGLE_CLIENT_SECRET: "${GOOGLE_CLIENT_SECRET}"
      NEXT_PUBLIC_POSTHOG_KEY: "${NEXT_PUBLIC_POSTHOG_KEY:-}"
      NEXT_PUBLIC_POSTHOG_HOST: "${NEXT_PUBLIC_POSTHOG_HOST:-https://us.i.posthog.com}"
      NODE_ENV: production
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - internal
      - traefik-public
    labels:
      - traefik.enable=true
      - traefik.docker.network=traefik-public
      - traefik.http.services.simverse.loadbalancer.server.port=3000

      - "traefik.http.routers.simverse-dashboard.rule=Host(`dashboard.simverse.sh`)"
      - traefik.http.routers.simverse-dashboard.entrypoints=websecure
      - traefik.http.routers.simverse-dashboard.service=simverse
      - traefik.http.routers.simverse-dashboard.tls.certresolver=letsencrypt
      - traefik.http.routers.simverse-dashboard.tls.domains[0].main=simverse.sh
      - traefik.http.routers.simverse-dashboard.tls.domains[0].sans=*.simverse.sh

      - "traefik.http.routers.simverse-miniapp.rule=Host(`miniapp.simverse.sh`)"
      - traefik.http.routers.simverse-miniapp.entrypoints=websecure
      - traefik.http.routers.simverse-miniapp.service=simverse
      - traefik.http.routers.simverse-miniapp.tls.certresolver=letsencrypt
      - traefik.http.routers.simverse-miniapp.tls.domains[0].main=simverse.sh
      - traefik.http.routers.simverse-miniapp.tls.domains[0].sans=*.simverse.sh

      # Public paths omit /api (https://api.simverse.sh/webhooks/...). Traefik
      # prefixes /api so Next.js still serves src/app/api/*. Bare /api/... still works.
      - traefik.http.middlewares.simverse-api-prefix.addprefix.prefix=/api

      - "traefik.http.routers.simverse-api.rule=Host(`api.simverse.sh`) && !PathPrefix(`/api`)"
      - traefik.http.routers.simverse-api.entrypoints=websecure
      - traefik.http.routers.simverse-api.service=simverse
      - traefik.http.routers.simverse-api.middlewares=simverse-api-prefix
      - traefik.http.routers.simverse-api.tls.certresolver=letsencrypt
      - traefik.http.routers.simverse-api.tls.domains[0].main=simverse.sh
      - traefik.http.routers.simverse-api.tls.domains[0].sans=*.simverse.sh

      - "traefik.http.routers.simverse-api-raw.rule=Host(`api.simverse.sh`) && PathPrefix(`/api`)"
      - traefik.http.routers.simverse-api-raw.entrypoints=websecure
      - traefik.http.routers.simverse-api-raw.service=simverse
      - traefik.http.routers.simverse-api-raw.tls.certresolver=letsencrypt
      - traefik.http.routers.simverse-api-raw.tls.domains[0].main=simverse.sh
      - traefik.http.routers.simverse-api-raw.tls.domains[0].sans=*.simverse.sh

  poller:
    build:
      context: .
      dockerfile: Dockerfile.poller
    container_name: poller
    restart: unless-stopped
    environment:
      DATABASE_URL: "${DATABASE_URL}"
      REDIS_URL: "${REDIS_URL}"
      ESIMACCESS_ACCESS_CODE: "${ESIMACCESS_ACCESS_CODE}"
      OPENROUTER_KEY: "${OPENROUTER_KEY}"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - internal
      - egress

  postgres:
    image: postgres:18.4
    container_name: postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: "${POSTGRES_USER}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"
      POSTGRES_DB: "${POSTGRES_DB}"
    volumes:
      - postgres_data:/var/lib/postgresql
      - pg_dumps:/dumps
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - internal
    labels:
      # Runs inside this container right before the backup archive step,
      # dumping a fresh consistent snapshot instead of taring the live data dir.
      - docker-volume-backup.exec-pre=sh -c 'pg_dump -U ${POSTGRES_USER} -d ${POSTGRES_DB} -F c -f /dumps/${POSTGRES_DB}-$$(date +%Y%m%d-%H%M%S).dump && find /dumps -name "*.dump" -mtime +7 -delete'

  backup:
    image: offen/docker-volume-backup:v2
    container_name: backup
    restart: unless-stopped
    environment:
      BACKUP_CRON: "0 3 * * *"           # daily at 03:00
      BACKUP_FILENAME: "pg-backup-%Y%m%d-%H%M%S.tar.gz"
      BACKUP_PRUNING_PREFIX: "pg-backup-"
      BACKUP_RETENTION_DAYS: "14"
      AWS_S3_BUCKET_NAME: "${AWS_S3_BUCKET_NAME}"
      AWS_ACCESS_KEY_ID: "${AWS_ACCESS_KEY_ID}"
      AWS_SECRET_ACCESS_KEY: "${AWS_SECRET_ACCESS_KEY}"
    volumes:
      - pg_dumps:/backup/pg_dumps:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      - postgres
    networks:
      - internal
      - egress

  redis:
    image: redis:8.8.1
    container_name: redis
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD}
    environment:
      REDIS_PASSWORD: "${REDIS_PASSWORD}"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep PONG"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - internal

networks:
  internal:
    internal: true
  egress:
  traefik-public:
    external: true

volumes:
  postgres_data:
  redis_data:
  pg_dumps:

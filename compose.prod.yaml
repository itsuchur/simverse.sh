# Usage: docker compose -f compose.prod.yaml up -d
services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_POSTHOG_KEY: "${NEXT_PUBLIC_POSTHOG_KEY:-}"
        NEXT_PUBLIC_POSTHOG_HOST: "${NEXT_PUBLIC_POSTHOG_HOST:-https://us.i.posthog.com}"
    container_name: app
    restart: unless-stopped
    environment:
      DATABASE_URL: "${DATABASE_URL}"
      REDIS_URL: "${REDIS_URL}"
      BETTER_AUTH_SECRET: "${BETTER_AUTH_SECRET}"
      BETTER_AUTH_URL: "${BETTER_AUTH_URL}"
      MINIAPP_URL: "${MINIAPP_URL}"
      API_URL: "${API_URL}"
      TELEGRAM_BOT_TOKEN: "${TELEGRAM_BOT_TOKEN}"
      TELEGRAM_BOT_USERNAME: "${TELEGRAM_BOT_USERNAME}"
      TELEGRAM_WEBHOOK_SECRET: "${TELEGRAM_WEBHOOK_SECRET}"
      ESIMACCESS_ACCESS_CODE: "${ESIMACCESS_ACCESS_CODE}"
      ESIMACCESS_WEBHOOK_SECRET: "${ESIMACCESS_WEBHOOK_SECRET}"
      TRYBIT_API_KEY: "${TRYBIT_API_KEY}"
      TRYBIT_SHOP_ID: "${TRYBIT_SHOP_ID}"
      TRYBIT_SECRET_KEY: "${TRYBIT_SECRET_KEY}"
      CARDLINK_API_TOKEN: "${CARDLINK_API_TOKEN}"
      CARDLINK_SHOP_ID: "${CARDLINK_SHOP_ID}"
      GOOGLE_CLIENT_ID: "${GOOGLE_CLIENT_ID}"
      GOOGLE_CLIENT_SECRET: "${GOOGLE_CLIENT_SECRET}"
      NEXT_PUBLIC_POSTHOG_KEY: "${NEXT_PUBLIC_POSTHOG_KEY:-}"
      NEXT_PUBLIC_POSTHOG_HOST: "${NEXT_PUBLIC_POSTHOG_HOST:-https://us.i.posthog.com}"
      STRAPI_URL: "${STRAPI_URL:-http://strapi:1337}"
      STRAPI_API_TOKEN: "${STRAPI_API_TOKEN:-}"
      BLOG_URL: "${BLOG_URL:-https://blog.simverse.sh}"
      NODE_ENV: production
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      redis-init:
        condition: service_completed_successfully
      strapi:
        condition: service_started
    networks:
      - internal
      - traefik-public
    labels:
      - traefik.enable=true
      - traefik.docker.network=traefik-public
      - traefik.http.services.simverse.loadbalancer.server.port=3000

      - "traefik.http.routers.simverse-home.rule=Host(`simverse.sh`) || Host(`www.simverse.sh`)"
      - traefik.http.routers.simverse-home.entrypoints=websecure
      - traefik.http.routers.simverse-home.service=simverse
      - traefik.http.routers.simverse-home.tls.certresolver=letsencrypt
      - traefik.http.routers.simverse-home.tls.domains[0].main=simverse.sh
      - traefik.http.routers.simverse-home.tls.domains[0].sans=*.simverse.sh

      - "traefik.http.routers.simverse-dashboard.rule=Host(`dashboard.simverse.sh`)"
      - traefik.http.routers.simverse-dashboard.entrypoints=websecure
      - traefik.http.routers.simverse-dashboard.service=simverse
      - traefik.http.routers.simverse-dashboard.tls.certresolver=letsencrypt
      - traefik.http.routers.simverse-dashboard.tls.domains[0].main=simverse.sh
      - traefik.http.routers.simverse-dashboard.tls.domains[0].sans=*.simverse.sh

      - "traefik.http.routers.simverse-miniapp.rule=Host(`miniapp.simverse.sh`)"
      - traefik.http.routers.simverse-miniapp.entrypoints=websecure
      - traefik.http.routers.simverse-miniapp.service=simverse
      - traefik.http.routers.simverse-miniapp.tls.certresolver=letsencrypt
      - traefik.http.routers.simverse-miniapp.tls.domains[0].main=simverse.sh
      - traefik.http.routers.simverse-miniapp.tls.domains[0].sans=*.simverse.sh
      # Do not addPrefix /app here. Pretty URLs (/successful-payment, /checkout)
      # are rewritten in src/proxy.ts so /api, /_next, /help, and legal pages stay
      # unprefixed. Traefik prefixing would break those.

      # Public paths omit /api (https://api.simverse.sh/webhooks/...). Traefik
      # prefixes /api so Next.js still serves src/app/api/*. Bare /api/... still works.
      - traefik.http.middlewares.simverse-api-prefix.addprefix.prefix=/api

      - "traefik.http.routers.simverse-api.rule=Host(`api.simverse.sh`) && !PathPrefix(`/api`)"
      - traefik.http.routers.simverse-api.entrypoints=websecure
      - traefik.http.routers.simverse-api.service=simverse
      - traefik.http.routers.simverse-api.middlewares=simverse-api-prefix
      - traefik.http.routers.simverse-api.tls.certresolver=letsencrypt
      - traefik.http.routers.simverse-api.tls.domains[0].main=simverse.sh
      - traefik.http.routers.simverse-api.tls.domains[0].sans=*.simverse.sh

      - "traefik.http.routers.simverse-api-raw.rule=Host(`api.simverse.sh`) && PathPrefix(`/api`)"
      - traefik.http.routers.simverse-api-raw.entrypoints=websecure
      - traefik.http.routers.simverse-api-raw.service=simverse
      - traefik.http.routers.simverse-api-raw.tls.certresolver=letsencrypt
      - traefik.http.routers.simverse-api-raw.tls.domains[0].main=simverse.sh
      - traefik.http.routers.simverse-api-raw.tls.domains[0].sans=*.simverse.sh

      - "traefik.http.routers.simverse-blog.rule=Host(`blog.simverse.sh`)"
      - traefik.http.routers.simverse-blog.entrypoints=websecure
      - traefik.http.routers.simverse-blog.service=simverse
      - traefik.http.routers.simverse-blog.tls.certresolver=letsencrypt
      - traefik.http.routers.simverse-blog.tls.domains[0].main=simverse.sh
      - traefik.http.routers.simverse-blog.tls.domains[0].sans=*.simverse.sh

  strapi:
    build:
      context: ./cms
      dockerfile: Dockerfile
    container_name: strapi
    restart: unless-stopped
    environment:
      NODE_ENV: production
      HOST: "0.0.0.0"
      PORT: "1337"
      PUBLIC_URL: "${STRAPI_PUBLIC_URL:-https://cms.simverse.sh}"
      DATABASE_CLIENT: postgres
      DATABASE_HOST: postgres
      DATABASE_PORT: "5432"
      DATABASE_NAME: strapi
      DATABASE_USERNAME: "${POSTGRES_USER}"
      DATABASE_PASSWORD: "${POSTGRES_PASSWORD}"
      DATABASE_SSL: "false"
      APP_KEYS: "${STRAPI_APP_KEYS}"
      API_TOKEN_SALT: "${STRAPI_API_TOKEN_SALT}"
      ADMIN_JWT_SECRET: "${STRAPI_ADMIN_JWT_SECRET}"
      TRANSFER_TOKEN_SALT: "${STRAPI_TRANSFER_TOKEN_SALT}"
      JWT_SECRET: "${STRAPI_JWT_SECRET}"
      ENCRYPTION_KEY: "${STRAPI_ENCRYPTION_KEY}"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - strapi_uploads:/opt/app/public/uploads
    networks:
      - internal
      - traefik-public
    labels:
      - traefik.enable=true
      - traefik.docker.network=traefik-public
      - traefik.http.services.strapi.loadbalancer.server.port=1337
      - "traefik.http.routers.strapi.rule=Host(`cms.simverse.sh`)"
      - traefik.http.routers.strapi.entrypoints=websecure
      - traefik.http.routers.strapi.service=strapi
      - traefik.http.routers.strapi.tls.certresolver=letsencrypt
      - traefik.http.routers.strapi.tls.domains[0].main=simverse.sh
      - traefik.http.routers.strapi.tls.domains[0].sans=*.simverse.sh

  poller:
    build:
      context: .
      dockerfile: Dockerfile.poller
    container_name: poller
    restart: unless-stopped
    environment:
      DATABASE_URL: "${DATABASE_URL}"
      REDIS_URL: "${REDIS_URL}"
      ESIMACCESS_ACCESS_CODE: "${ESIMACCESS_ACCESS_CODE}"
      OPENROUTER_KEY: "${OPENROUTER_KEY}"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      redis-init:
        condition: service_completed_successfully
    networks:
      - internal
      - egress

  mcp:
    build:
      context: ./mcp
      dockerfile: Dockerfile
    container_name: mcp
    restart: unless-stopped
    environment:
      MCP_HOST: "0.0.0.0"
      MCP_PORT: "4000"
      REDIS_URL: "${REDIS_URL}"
      OPENROUTER_API_KEY: "${OPENROUTER_KEY}"
      OPENROUTER_MODEL: "${OPENROUTER_MODEL:-mistralai/mistral-small-3.2-24b-instruct}"
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - internal
      - egress

  postgres:
    image: postgres:18.4
    container_name: postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: "${POSTGRES_USER}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"
      POSTGRES_DB: "${POSTGRES_DB}"
    volumes:
      - postgres_data:/var/lib/postgresql
      - pg_dumps:/dumps
      - ./docker/postgres:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - internal
    labels:
      # Runs inside this container right before the backup archive step,
      # dumping a fresh consistent snapshot instead of taring the live data dir.
      - docker-volume-backup.exec-pre=sh -c 'pg_dump -U ${POSTGRES_USER} -d ${POSTGRES_DB} -F c -f /dumps/${POSTGRES_DB}-$$(date +%Y%m%d-%H%M%S).dump && pg_dump -U ${POSTGRES_USER} -d strapi -F c -f /dumps/strapi-$$(date +%Y%m%d-%H%M%S).dump && find /dumps -name "*.dump" -mtime +7 -delete'

  backup:
    image: offen/docker-volume-backup:v2
    container_name: backup
    restart: unless-stopped
    environment:
      BACKUP_CRON: "0 3 * * *"           # daily at 03:00
      BACKUP_FILENAME: "pg-backup-%Y%m%d-%H%M%S.tar.gz"
      BACKUP_PRUNING_PREFIX: "pg-backup-"
      BACKUP_RETENTION_DAYS: "14"
      AWS_S3_BUCKET_NAME: "${AWS_S3_BUCKET_NAME}"
      AWS_ACCESS_KEY_ID: "${AWS_ACCESS_KEY_ID}"
      AWS_SECRET_ACCESS_KEY: "${AWS_SECRET_ACCESS_KEY}"
    volumes:
      - pg_dumps:/backup/pg_dumps:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      - postgres
    networks:
      - internal
      - egress

  redis:
    image: redis:8.8.1
    container_name: redis
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD}
    environment:
      REDIS_PASSWORD: "${REDIS_PASSWORD}"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep PONG"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - internal

  redis-init:
    image: redis:8.8.1
    container_name: redis-init
    restart: "no"
    depends_on:
      redis:
        condition: service_healthy
    environment:
      REDIS_PASSWORD: "${REDIS_PASSWORD}"
    command:
      [
        "sh",
        "-c",
        'redis-cli -h redis -a "$$REDIS_PASSWORD" --no-auth-warning SET SALES_ACTIVE false',
      ]
    networks:
      - internal

networks:
  internal:
    internal: true
  egress:
  traefik-public:
    external: true

volumes:
  postgres_data:
  redis_data:
  pg_dumps:
  strapi_uploads:

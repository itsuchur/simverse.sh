# Local / development Compose stack (no Traefik, published ports, hot reload).
# Usage: docker compose -f compose.override.yaml up --build

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile.dev
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: "${DATABASE_URL}"
      REDIS_URL: "${REDIS_URL}"
      BETTER_AUTH_SECRET: "${BETTER_AUTH_SECRET}"
      BETTER_AUTH_URL: "${BETTER_AUTH_URL}"
      TELEGRAM_BOT_TOKEN: "${TELEGRAM_BOT_TOKEN}"
      TELEGRAM_BOT_USERNAME: "${TELEGRAM_BOT_USERNAME}"
      TELEGRAM_WEBHOOK_SECRET: "${TELEGRAM_WEBHOOK_SECRET}"
      ESIMACCESS_ACCESS_CODE: "${ESIMACCESS_ACCESS_CODE}"
      ESIMACCESS_WEBHOOK_SECRET: "${ESIMACCESS_WEBHOOK_SECRET}"
      TRYBIT_API_KEY: "${TRYBIT_API_KEY}"
      TRYBIT_SHOP_ID: "${TRYBIT_SHOP_ID}"
      TRYBIT_SECRET_KEY: "${TRYBIT_SECRET_KEY}"
      CARDLINK_API_TOKEN: "${CARDLINK_API_TOKEN}"
      CARDLINK_SHOP_ID: "${CARDLINK_SHOP_ID}"
      GOOGLE_CLIENT_ID: "${GOOGLE_CLIENT_ID}"
      GOOGLE_CLIENT_SECRET: "${GOOGLE_CLIENT_SECRET}"
      NODE_ENV: development
      WATCHPACK_POLLING: "true"
      CHOKIDAR_USEPOLLING: "true"
      STRAPI_URL: "${STRAPI_URL:-http://strapi:1337}"
      STRAPI_API_TOKEN: "${STRAPI_API_TOKEN:-}"
    volumes:
      - .:/app
      - app_node_modules:/app/node_modules
      - app_next:/app/.next
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      redis-init:
        condition: service_completed_successfully
      strapi:
        condition: service_started

  strapi:
    build:
      context: ./cms
      dockerfile: Dockerfile.dev
    ports:
      - "1337:1337"
    environment:
      NODE_ENV: development
      HOST: "0.0.0.0"
      PORT: "1337"
      PUBLIC_URL: "${STRAPI_PUBLIC_URL:-http://localhost:1337}"
      DATABASE_CLIENT: postgres
      DATABASE_HOST: postgres
      DATABASE_PORT: "5432"
      DATABASE_NAME: strapi
      DATABASE_USERNAME: "${POSTGRES_USER}"
      DATABASE_PASSWORD: "${POSTGRES_PASSWORD}"
      DATABASE_SSL: "false"
      APP_KEYS: "${STRAPI_APP_KEYS}"
      API_TOKEN_SALT: "${STRAPI_API_TOKEN_SALT}"
      ADMIN_JWT_SECRET: "${STRAPI_ADMIN_JWT_SECRET}"
      TRANSFER_TOKEN_SALT: "${STRAPI_TRANSFER_TOKEN_SALT}"
      JWT_SECRET: "${STRAPI_JWT_SECRET}"
      ENCRYPTION_KEY: "${STRAPI_ENCRYPTION_KEY}"
    volumes:
      - ./cms/config:/opt/app/config
      - ./cms/src:/opt/app/src
      - ./cms/package.json:/opt/package.json
      - ./cms/bun.lock:/opt/bun.lock
      - strapi_uploads:/opt/app/public/uploads
    depends_on:
      postgres:
        condition: service_healthy

  poller:
    build:
      context: .
      dockerfile: Dockerfile.poller.dev
    command: ["bun", "--conditions=react-server", "--watch", "src/server/cron/root.ts"]
    environment:
      DATABASE_URL: "${DATABASE_URL}"
      REDIS_URL: "${REDIS_URL}"
      ESIMACCESS_ACCESS_CODE: "${ESIMACCESS_ACCESS_CODE}"
      OPENROUTER_KEY: "${OPENROUTER_KEY}"
      NODE_ENV: development
    volumes:
      - .:/app
      - poller_node_modules:/app/node_modules
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      redis-init:
        condition: service_completed_successfully

  mcp:
    build:
      context: ./mcp
      dockerfile: Dockerfile
    ports:
      - "4000:4000"
    environment:
      MCP_HOST: "0.0.0.0"
      MCP_PORT: "4000"
      REDIS_URL: "${REDIS_URL}"
      OPENROUTER_API_KEY: "${OPENROUTER_KEY}"
      OPENROUTER_MODEL: "${OPENROUTER_MODEL:-mistralai/mistral-small-3.2-24b-instruct}"
    depends_on:
      redis:
        condition: service_healthy

  postgres:
    image: postgres:18.4
    environment:
      POSTGRES_USER: "${POSTGRES_USER}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"
      POSTGRES_DB: "${POSTGRES_DB}"
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./docker/postgres:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:8.8.1
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD}
    environment:
      REDIS_PASSWORD: "${REDIS_PASSWORD}"
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep PONG"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis-init:
    image: redis:8.8.1
    restart: "no"
    depends_on:
      redis:
        condition: service_healthy
    environment:
      REDIS_PASSWORD: "${REDIS_PASSWORD}"
    command:
      [
        "sh",
        "-c",
        'redis-cli -h redis -a "$$REDIS_PASSWORD" --no-auth-warning SET SALES_ACTIVE false',
      ]

volumes:
  postgres_data:
  redis_data:
  app_node_modules:
  app_next:
  poller_node_modules:
  strapi_uploads:
